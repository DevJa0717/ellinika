<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="'Noto Sans','Segoe UI',Roboto,Arial,sans-serif"><title>Η ιεραρχία των κανόνων δικαίου</title><rect width="1100" height="660" fill="#fbf8f1"/><text x="40" y="54" font-size="32" font-weight="700" fill="#1d2433">Η ιεραρχία των κανόνων δικαίου</text><text x="40" y="86" font-size="19" fill="#5b6475">Which rule prevails: from the Constitution down to a minister&#x27;s decision</text><polygon points="460,120 640,120 725,212 375,212" fill="#1f3a5f"/><text x="550" y="160" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">Σύνταγμα</text><text x="550" y="188" font-size="16" font-weight="400" fill="#fff" text-anchor="middle">Constitution</text><polygon points="375,220 725,220 810,312 290,312" fill="#0d5eaf"/><text x="550" y="260" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">Διεθνές και ενωσιακό δίκαιο</text><text x="550" y="288" font-size="16" font-weight="400" fill="#fff" text-anchor="middle">international law, EU law (Art. 28)</text><polygon points="290,320 810,320 895,412 205,412" fill="#2a8c82"/><text x="550" y="360" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">Νόμοι της Βουλής · ΠΝΠ</text><text x="550" y="388" font-size="16" font-weight="400" fill="#fff" text-anchor="middle">statutes · acts of legislative content (Art. 44)</text><polygon points="205,420 895,420 980,512 120,512" fill="#c8962e"/><text x="550" y="460" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">Προεδρικά διατάγματα</text><text x="550" y="488" font-size="16" font-weight="400" fill="#fff" text-anchor="middle">presidential decrees, checked by the Council of State</text><polygon points="120,520 980,520 1065,612 35,612" fill="#8a7a5a"/><text x="550" y="560" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">Υπουργικές αποφάσεις</text><text x="550" y="588" font-size="16" font-weight="400" fill="#fff" text-anchor="middle">ministerial decisions</text><line x1="1040" y1="600" x2="1040" y2="130" stroke="#5b6475" stroke-width="3"/><polygon points="1040,130 1045.5,142.9 1034.5,142.9" fill="#5b6475"/><text x="1020" y="380" font-size="18" font-weight="600" fill="#5b6475" text-anchor="end">υπερέχει</text></svg>