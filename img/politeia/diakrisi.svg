<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="'Noto Sans','Segoe UI',Roboto,Arial,sans-serif"><title>Η διάκριση των εξουσιών</title><rect width="1100" height="640" fill="#fbf8f1"/><text x="40" y="54" font-size="32" font-weight="700" fill="#1d2433">Η διάκριση των εξουσιών</text><text x="40" y="86" font-size="19" fill="#5b6475">The separation of powers in the Constitution of 1975</text><rect x="40" y="130" width="320" height="250" rx="14" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><path d="M40 144 a14 14 0 0 1 14 -14 h292 a14 14 0 0 1 14 14 v34 h-320 z" fill="#1f3a5f"/><text x="200.0" y="163" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Νομοθετική</text><text x="200.0" y="206" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">legislative · Άρθρο 26(1)</text><text x="200.0" y="236.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">Βουλή (300 βουλευτές)</text><text x="200.0" y="260.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">και Πρόεδρος της</text><text x="200.0" y="285.4" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">Δημοκρατίας</text><text x="200.0" y="310.1" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">ψηφίζουν τους νόμους</text><rect x="390" y="130" width="320" height="250" rx="14" fill="#fff" stroke="#0d5eaf" stroke-width="3"/><path d="M390 144 a14 14 0 0 1 14 -14 h292 a14 14 0 0 1 14 14 v34 h-320 z" fill="#0d5eaf"/><text x="550.0" y="163" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Εκτελεστική</text><text x="550.0" y="206" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">executive · Άρθρο 26(2)</text><text x="550.0" y="236.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">Πρόεδρος της Δημοκρατίας</text><text x="550.0" y="260.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">και Κυβέρνηση</text><text x="550.0" y="285.4" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">εφαρμόζουν τους νόμους</text><rect x="740" y="130" width="320" height="250" rx="14" fill="#fff" stroke="#2a8c82" stroke-width="3"/><path d="M740 144 a14 14 0 0 1 14 -14 h292 a14 14 0 0 1 14 14 v34 h-320 z" fill="#2a8c82"/><text x="900.0" y="163" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Δικαστική</text><text x="900.0" y="206" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">judicial · Άρθρο 26(3)</text><text x="900.0" y="236.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">Τα δικαστήρια</text><text x="900.0" y="260.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">αποφασίζουν «εν ονόματι</text><text x="900.0" y="285.4" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">του Ελληνικού Λαού»</text><line x1="360" y1="300" x2="390" y2="300" stroke="#1f3a5f" stroke-width="3"/><polygon points="390,300 377.1,305.5 377.1,294.5" fill="#1f3a5f"/><text x="200" y="430" font-size="19" font-weight="600" fill="#1f3a5f" text-anchor="middle">Η Βουλή δίνει ή αρνείται</text><text x="200" y="456" font-size="19" font-weight="600" fill="#1f3a5f" text-anchor="middle">ψήφο εμπιστοσύνης στην Κυβέρνηση</text><text x="200" y="484" font-size="16" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">confidence vote (Άρθρα 84, 37)</text><text x="550" y="430" font-size="19" font-weight="600" fill="#0d5eaf" text-anchor="middle">Η Κυβέρνηση φέρνει νομοσχέδια</text><text x="550" y="456" font-size="19" font-weight="600" fill="#0d5eaf" text-anchor="middle">και ελέγχεται στη Βουλή</text><text x="550" y="484" font-size="16" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">bills, questions, inquiries</text><text x="900" y="430" font-size="19" font-weight="600" fill="#2a8c82" text-anchor="middle">Κάθε δικαστής αφήνει</text><text x="900" y="456" font-size="19" font-weight="600" fill="#2a8c82" text-anchor="middle">ανεφάρμοστο αντισυνταγματικό νόμο</text><text x="900" y="484" font-size="16" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">diffuse review (Άρθρο 93(4))</text><rect x="40" y="520" width="1020" height="64" rx="12" fill="#efe8d8"/><text x="550" y="560" font-size="21" font-weight="700" fill="#1d2433" text-anchor="middle">Πάνω από όλους: το Σύνταγμα και η λαϊκή κυριαρχία (Άρθρο 1)</text></svg>