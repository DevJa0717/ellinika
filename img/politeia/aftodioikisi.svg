<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" font-family="'Noto Sans','Segoe UI',Roboto,Arial,sans-serif"><title>Τα επίπεδα της διοίκησης</title><rect width="1100" height="680" fill="#fbf8f1"/><text x="40" y="54" font-size="32" font-weight="700" fill="#1d2433">Τα επίπεδα της διοίκησης</text><text x="40" y="86" font-size="19" fill="#5b6475">Central State, decentralised administrations and the two levels of local government</text><rect x="250" y="115" width="600" height="120" rx="14" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><path d="M250 129 a14 14 0 0 1 14 -14 h572 a14 14 0 0 1 14 14 v34 h-600 z" fill="#1f3a5f"/><text x="550.0" y="148" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Κεντρικό κράτος</text><text x="550.0" y="191" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">central State</text><text x="550.0" y="221.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">υπουργεία, Αθήνα</text><rect x="40" y="290" width="330" height="170" rx="14" fill="#fff" stroke="#7d7d7d" stroke-width="3"/><path d="M40 304 a14 14 0 0 1 14 -14 h302 a14 14 0 0 1 14 14 v34 h-330 z" fill="#7d7d7d"/><text x="205.0" y="323" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">7 αποκεντρωμένες</text><text x="205.0" y="366" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">not elected</text><text x="205.0" y="396.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">διοικήσεις του κράτους:</text><text x="205.0" y="420.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">έλεγχος νομιμότητας</text><rect x="400" y="290" width="660" height="170" rx="14" fill="#fff" stroke="#0d5eaf" stroke-width="3"/><path d="M400 304 a14 14 0 0 1 14 -14 h632 a14 14 0 0 1 14 14 v34 h-660 z" fill="#0d5eaf"/><text x="730.0" y="323" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2ος βαθμός: 13 περιφέρειες</text><text x="730.0" y="366" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">regions, elected every 5 years</text><text x="730.0" y="396.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">περιφερειάρχης και περιφερειακό συμβούλιο</text><text x="730.0" y="420.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">74 περιφερειακές ενότητες</text><rect x="400" y="490" width="660" height="150" rx="14" fill="#fff" stroke="#2a8c82" stroke-width="3"/><path d="M400 504 a14 14 0 0 1 14 -14 h632 a14 14 0 0 1 14 14 v34 h-660 z" fill="#2a8c82"/><text x="730.0" y="523" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1ος βαθμός: 332 δήμοι</text><text x="730.0" y="566" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">municipalities, elected every 5 years</text><text x="730.0" y="596.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">δήμαρχος και δημοτικό συμβούλιο</text><line x1="330" y1="235" x2="205" y2="290" stroke="#5b6475" stroke-width="3"/><polygon points="205,290 214.6,279.8 219.0,289.8" fill="#5b6475"/><line x1="370" y1="375" x2="400" y2="375" stroke="#7d7d7d" stroke-width="3"/><polygon points="400,375 387.1,380.5 387.1,369.5" fill="#7d7d7d"/><path d="M205 460 V565 H400" fill="none" stroke="#7d7d7d" stroke-width="3"/><line x1="380" y1="565" x2="400" y2="565" stroke="#7d7d7d" stroke-width="3"/><polygon points="400,565 387.1,570.5 387.1,559.5" fill="#7d7d7d"/><text x="215" y="600" font-size="17" font-weight="600" fill="#7d7d7d" text-anchor="start">έλεγχος νομιμότητας</text></svg>