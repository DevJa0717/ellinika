<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 676" width="1100" height="676" font-family="'Noto Sans','Segoe UI',Roboto,Arial,sans-serif"><title>Από το γκισέ στο κινητό</title><rect width="1100" height="676" fill="#fbf8f1"/><text x="40" y="54" font-size="32" font-weight="700" fill="#1d2433">Από το γκισέ στο κινητό</text><text x="40" y="86" font-size="19" fill="#5b6475">Milestones of the digital Greek state</text><line x1="200" y1="130" x2="200" y2="626" stroke="#c9c2b2" stroke-width="5"/><circle cx="200" cy="150" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="159" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">1911</text><text x="232" y="154" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Μονιμότητα των δημοσίων υπαλλήλων</text><text x="232" y="182" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">permanence of civil servants enters the Constitution</text><circle cx="200" cy="236" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="245" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">1994</text><text x="232" y="240" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">ΑΣΕΠ: διορισμοί με διαγωνισμό ή μόρια</text><text x="232" y="268" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">merit-based hiring under an independent body</text><circle cx="200" cy="322" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="331" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">2000s</text><text x="232" y="326" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Taxisnet: φορολογικές δηλώσεις online</text><text x="232" y="354" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">online income-tax returns</text><circle cx="200" cy="408" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="417" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">2010</text><text x="232" y="412" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Διαύγεια: όλες οι αποφάσεις στο διαδίκτυο</text><text x="232" y="440" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">every public decision posted online</text><circle cx="200" cy="494" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="503" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">2019</text><text x="232" y="498" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Υπουργείο Ψηφιακής Διακυβέρνησης</text><text x="232" y="526" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">Ministry of Digital Governance</text><circle cx="200" cy="580" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="589" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">2020</text><text x="232" y="584" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">gov.gr: πάνω από χίλιες υπηρεσίες</text><text x="232" y="612" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">single portal for state services</text></svg>