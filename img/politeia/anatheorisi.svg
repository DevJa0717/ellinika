<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="'Noto Sans','Segoe UI',Roboto,Arial,sans-serif"><title>Πώς αλλάζει το Σύνταγμα</title><rect width="1100" height="700" fill="#fbf8f1"/><text x="40" y="54" font-size="32" font-weight="700" fill="#1d2433">Πώς αλλάζει το Σύνταγμα</text><text x="40" y="86" font-size="19" fill="#5b6475">Revising the Constitution: Article 110, over two parliamentary terms</text><rect x="40" y="120" width="300" height="170" rx="14" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><path d="M40 134 a14 14 0 0 1 14 -14 h272 a14 14 0 0 1 14 14 v34 h-300 z" fill="#1f3a5f"/><text x="190.0" y="153" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1. Πρόταση</text><text x="190.0" y="196" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">proposal</text><text x="190.0" y="226.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">τουλάχιστον 50 βουλευτές</text><text x="190.0" y="250.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">ορίζουν τα άρθρα</text><rect x="400" y="120" width="300" height="170" rx="14" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><path d="M400 134 a14 14 0 0 1 14 -14 h272 a14 14 0 0 1 14 14 v34 h-300 z" fill="#1f3a5f"/><text x="550.0" y="153" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2. Δύο ψηφοφορίες</text><text x="550.0" y="196" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">two votes, a month apart</text><text x="550.0" y="226.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">με απόσταση</text><text x="550.0" y="250.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">τουλάχιστον ενός μήνα</text><rect x="760" y="120" width="300" height="170" rx="14" fill="#fff" stroke="#c8962e" stroke-width="3"/><path d="M760 134 a14 14 0 0 1 14 -14 h272 a14 14 0 0 1 14 14 v34 h-300 z" fill="#c8962e"/><text x="910.0" y="153" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3. Εκλογές</text><text x="910.0" y="196" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">general election</text><text x="910.0" y="226.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">νέα Βουλή:</text><text x="910.0" y="250.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">η αναθεωρητική</text><line x1="340" y1="205" x2="400" y2="205" stroke="#5b6475" stroke-width="3"/><polygon points="400,205 387.1,210.5 387.1,199.5" fill="#5b6475"/><line x1="700" y1="205" x2="760" y2="205" stroke="#5b6475" stroke-width="3"/><polygon points="760,205 747.1,210.5 747.1,199.5" fill="#5b6475"/><text x="550" y="345" font-size="20" font-weight="600" fill="#1d2433" text-anchor="middle">Η πλειοψηφία της πρώτης Βουλής καθορίζει τι χρειάζεται η δεύτερη:</text><rect x="90" y="380" width="420" height="160" rx="14" fill="#fff" stroke="#0d5eaf" stroke-width="3"/><path d="M90 394 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v34 h-420 z" fill="#0d5eaf"/><text x="300.0" y="413" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">180+ ψήφοι (3/5)</text><text x="300.0" y="456" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">first Parliament: three fifths</text><text x="300.0" y="486.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">η επόμενη Βουλή αποφασίζει</text><text x="300.0" y="510.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">με 151 ψήφους</text><rect x="590" y="380" width="420" height="160" rx="14" fill="#fff" stroke="#2a8c82" stroke-width="3"/><path d="M590 394 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v34 h-420 z" fill="#2a8c82"/><text x="800.0" y="413" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">151–179 ψήφοι</text><text x="800.0" y="456" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">first Parliament: absolute majority</text><text x="800.0" y="486.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">η επόμενη Βουλή χρειάζεται</text><text x="800.0" y="510.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">180 ψήφους</text><rect x="40" y="570" width="1020" height="84" rx="12" fill="#efe8d8"/><text x="550" y="604" font-size="18" font-weight="600" fill="#1d2433" text-anchor="middle">Δεν αναθεωρούνται: η μορφή του πολιτεύματος και βασικά άρθρα για δικαιώματα (Άρθρο 110(1)).</text><text x="550" y="634" font-size="18" font-weight="600" fill="#1d2433" text-anchor="middle">Νέα αναθεώρηση μόνο πέντε χρόνια μετά την προηγούμενη (Άρθρο 110(6)).</text></svg>