<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 848" width="1100" height="848" font-family="'Noto Sans','Segoe UI',Roboto,Arial,sans-serif"><title>Μισός αιώνας δημοκρατίας</title><rect width="1100" height="848" fill="#fbf8f1"/><text x="40" y="54" font-size="32" font-weight="700" fill="#1d2433">Μισός αιώνας δημοκρατίας</text><text x="40" y="86" font-size="19" fill="#5b6475">The Third Hellenic Republic: some turning points since 1974</text><line x1="200" y1="130" x2="200" y2="798" stroke="#c9c2b2" stroke-width="5"/><circle cx="200" cy="150" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="159" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">1974</text><text x="232" y="154" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Μεταπολίτευση · δημοψήφισμα για το πολίτευμα</text><text x="232" y="182" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">fall of the junta; monarchy abolished by referendum</text><circle cx="200" cy="236" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="245" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">1975</text><text x="232" y="240" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Το Σύνταγμα της Τρίτης Ελληνικής Δημοκρατίας</text><text x="232" y="268" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">the Constitution in force today</text><circle cx="200" cy="322" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="331" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">1981</text><text x="232" y="326" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Ένταξη στην ΕΟΚ · πρώτη κυβέρνηση ΠΑΣΟΚ</text><text x="232" y="354" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">EEC membership; first PASOK government</text><circle cx="200" cy="408" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="417" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">2001</text><text x="232" y="412" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Η Ελλάδα στην ευρωζώνη</text><text x="232" y="440" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">Greece joins the euro area</text><circle cx="200" cy="494" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="503" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">2010</text><text x="232" y="498" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Το πρώτο μνημόνιο</text><text x="232" y="526" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">the first bailout programme</text><circle cx="200" cy="580" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="589" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">2015</text><text x="232" y="584" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Δημοψήφισμα και τρίτο μνημόνιο</text><text x="232" y="612" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">referendum, then a third programme</text><circle cx="200" cy="666" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="675" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">2018</text><text x="232" y="670" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Τέλος των προγραμμάτων στήριξης</text><text x="232" y="698" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">exit from the bailout programmes</text><circle cx="200" cy="752" r="13" fill="#0d5eaf" stroke="#fff" stroke-width="4"/><text x="170" y="761" font-size="25" font-weight="700" fill="#1f3a5f" text-anchor="end">2023</text><text x="232" y="756" font-size="22" font-weight="600" fill="#1d2433" text-anchor="start">Διπλές εκλογές, Μάιος και Ιούνιος</text><text x="232" y="784" font-size="17" font-weight="400" fill="#5b6475" text-anchor="start" font-style="italic">two elections within five weeks</text></svg>