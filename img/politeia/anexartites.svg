<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" font-family="'Noto Sans','Segoe UI',Roboto,Arial,sans-serif"><title>Οι ανεξάρτητες αρχές</title><rect width="1100" height="680" fill="#fbf8f1"/><text x="40" y="54" font-size="32" font-weight="700" fill="#1d2433">Οι ανεξάρτητες αρχές</text><text x="40" y="86" font-size="19" fill="#5b6475">Bodies that take no orders from the Government</text><text x="40" y="140" font-size="19" font-weight="600" fill="#1d2433" text-anchor="start">Στο Σύνταγμα από το 2001 (Άρθρο 101Α): μέλη από τη Διάσκεψη των Προέδρων με 3/5</text><rect x="40" y="170" width="325" height="145" rx="14" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><text x="202" y="214" font-size="21" font-weight="700" fill="#1f3a5f" text-anchor="middle">Συνήγορος του Πολίτη</text><text x="202" y="246" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">Ombudsman · 1998</text><text x="202" y="284" font-size="18" font-weight="600" fill="#1d2433" text-anchor="middle">Άρθρο 103(9)</text><rect x="385" y="170" width="325" height="145" rx="14" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><text x="547" y="214" font-size="21" font-weight="700" fill="#1f3a5f" text-anchor="middle">ΑΣΕΠ</text><text x="547" y="246" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">public-sector hiring · 1994</text><text x="547" y="284" font-size="18" font-weight="600" fill="#1d2433" text-anchor="middle">Άρθρο 103(7)</text><rect x="730" y="170" width="325" height="145" rx="14" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><text x="892" y="214" font-size="21" font-weight="700" fill="#1f3a5f" text-anchor="middle">Αρχή Προστασίας Δεδομένων</text><text x="892" y="246" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">data protection · 1997</text><text x="892" y="284" font-size="18" font-weight="600" fill="#1d2433" text-anchor="middle">Άρθρο 9Α</text><rect x="40" y="340" width="325" height="145" rx="14" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><text x="202" y="384" font-size="21" font-weight="700" fill="#1f3a5f" text-anchor="middle">ΕΣΡ</text><text x="202" y="416" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">radio and television · 1989</text><text x="202" y="454" font-size="18" font-weight="600" fill="#1d2433" text-anchor="middle">Άρθρο 15(2)</text><rect x="385" y="340" width="325" height="145" rx="14" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><text x="547" y="384" font-size="21" font-weight="700" fill="#1f3a5f" text-anchor="middle">ΑΔΑΕ</text><text x="547" y="416" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">privacy of communications · 2003</text><text x="547" y="454" font-size="18" font-weight="600" fill="#1d2433" text-anchor="middle">Άρθρο 19(2)</text><text x="40" y="545" font-size="19" font-weight="600" fill="#1d2433" text-anchor="start">Από την κρίση χρέους:</text><rect x="40" y="565" width="500" height="80" rx="14" fill="#fff" stroke="#2a8c82" stroke-width="3"/><text x="290" y="598" font-size="21" font-weight="700" fill="#2a8c82" text-anchor="middle">ΕΛΣΤΑΤ</text><text x="290" y="628" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">statistics · ανεξάρτητη από το 2010</text><rect x="560" y="565" width="500" height="80" rx="14" fill="#fff" stroke="#2a8c82" stroke-width="3"/><text x="810" y="598" font-size="21" font-weight="700" fill="#2a8c82" text-anchor="middle">ΑΑΔΕ</text><text x="810" y="628" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">tax and customs · από το 2017</text></svg>