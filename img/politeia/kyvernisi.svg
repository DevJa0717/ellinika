<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="'Noto Sans','Segoe UI',Roboto,Arial,sans-serif"><title>Πώς σχηματίζεται κυβέρνηση</title><rect width="1100" height="720" fill="#fbf8f1"/><text x="40" y="54" font-size="32" font-weight="700" fill="#1d2433">Πώς σχηματίζεται κυβέρνηση</text><text x="40" y="86" font-size="19" fill="#5b6475">Forming a government after an election (Articles 37 and 84)</text><rect x="40" y="120" width="330" height="180" rx="14" fill="#fff" stroke="#3f8f4a" stroke-width="3"/><path d="M40 134 a14 14 0 0 1 14 -14 h302 a14 14 0 0 1 14 14 v34 h-330 z" fill="#3f8f4a"/><text x="205.0" y="153" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Αυτοδυναμία;</text><text x="205.0" y="196" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">Art. 37(2)</text><text x="205.0" y="226.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">Αν ένα κόμμα έχει 151+</text><text x="205.0" y="250.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">έδρες, ο αρχηγός του</text><text x="205.0" y="275.4" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">γίνεται πρωθυπουργός</text><rect x="400" y="120" width="660" height="180" rx="14" fill="#fff" stroke="#0d5eaf" stroke-width="3"/><path d="M400 134 a14 14 0 0 1 14 -14 h632 a14 14 0 0 1 14 14 v34 h-660 z" fill="#0d5eaf"/><text x="730.0" y="153" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Διερευνητικές εντολές</text><text x="730.0" y="196.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">Ο Πρόεδρος δίνει εντολή στο 1ο, μετά στο 2ο</text><text x="730.0" y="220.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">και στο 3ο κόμμα, για τρεις μέρες στο καθένα</text><text x="730.0" y="245.4" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">exploratory mandates, Art. 37(3)</text><line x1="370" y1="210" x2="400" y2="210" stroke="#5b6475" stroke-width="3"/><polygon points="400,210 387.1,215.5 387.1,204.5" fill="#5b6475"/><text x="205" y="335" font-size="20" font-weight="700" fill="#3f8f4a" text-anchor="middle">ναι</text><rect x="40" y="360" width="330" height="170" rx="14" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><path d="M40 374 a14 14 0 0 1 14 -14 h302 a14 14 0 0 1 14 14 v34 h-330 z" fill="#1f3a5f"/><text x="205.0" y="393" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Ορκωμοσία</text><text x="205.0" y="436" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">Art. 84</text><text x="205.0" y="466.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">και ψήφος εμπιστοσύνης</text><text x="205.0" y="490.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">μέσα σε 15 μέρες</text><line x1="205" y1="300" x2="205" y2="360" stroke="#3f8f4a" stroke-width="3"/><polygon points="205,360 199.5,347.1 210.5,347.1" fill="#3f8f4a"/><rect x="400" y="360" width="310" height="170" rx="14" fill="#fff" stroke="#2a8c82" stroke-width="3"/><path d="M400 374 a14 14 0 0 1 14 -14 h282 a14 14 0 0 1 14 14 v34 h-310 z" fill="#2a8c82"/><text x="555.0" y="393" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Συμμαχία</text><text x="555.0" y="436" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">coalition</text><text x="555.0" y="466.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">αν βρεθεί πλειοψηφία,</text><text x="555.0" y="490.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">κυβέρνηση συνεργασίας</text><rect x="750" y="360" width="310" height="170" rx="14" fill="#fff" stroke="#c8962e" stroke-width="3"/><path d="M750 374 a14 14 0 0 1 14 -14 h282 a14 14 0 0 1 14 14 v34 h-310 z" fill="#c8962e"/><text x="905.0" y="393" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Υπηρεσιακή</text><text x="905.0" y="436" font-size="17" font-weight="400" fill="#5b6475" text-anchor="middle" font-style="italic">caretaker, Art. 37(3)</text><text x="905.0" y="466.0" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">κυβέρνηση με ανώτατο</text><text x="905.0" y="490.7" font-size="19" font-weight="400" fill="#1d2433" text-anchor="middle">δικαστή και εκλογές</text><line x1="555" y1="300" x2="555" y2="360" stroke="#2a8c82" stroke-width="3"/><polygon points="555,360 549.5,347.1 560.5,347.1" fill="#2a8c82"/><line x1="905" y1="300" x2="905" y2="360" stroke="#c8962e" stroke-width="3"/><polygon points="905,360 899.5,347.1 910.5,347.1" fill="#c8962e"/><line x1="400" y1="445" x2="370" y2="445" stroke="#2a8c82" stroke-width="3"/><polygon points="370,445 382.9,439.5 382.9,450.5" fill="#2a8c82"/><rect x="40" y="570" width="1020" height="96" rx="12" fill="#efe8d8"/><text x="550" y="606" font-size="19" font-weight="600" fill="#1d2433" text-anchor="middle">Μάιος 2023: κανένα κόμμα δεν δέχτηκε να σχηματίσει κυβέρνηση.</text><text x="550" y="640" font-size="19" font-weight="600" fill="#1d2433" text-anchor="middle">Υπηρεσιακός πρωθυπουργός ο Ιωάννης Σαρμάς, και νέες εκλογές στις 25 Ιουνίου.</text></svg>